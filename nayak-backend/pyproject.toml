[project]
name = "nayak-backend"
version = "0.1.0"
description = "Legal AI assistant backend"
readme = "README.md"
authors = [
    { name = "Danish-khan-coder", email = "khandanishasad65@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.5",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.1",
    "groq>=0.5.0",
    "huggingface-hub>=0.23.0",
    "llama-cpp-python>=0.2.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnuv"]