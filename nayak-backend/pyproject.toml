[project]
name = "app"
version = "0.1.0"
description = "Nayak your legal Sahayak"
readme = "README.md"
authors = [
    { name = "Revenant", email = "Revenat@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.30.0",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "huggingface-hub>=1.27.0",
    "llama-cpp-python>=0.3.34",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.52",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "pypdf>=6.16.1",
]

[tool.uv.extra-build-dependencies]
app = ["setuptools"]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
app = "uv_build"
